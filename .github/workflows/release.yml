# Publishes the tag to npm. No long-lived key once npm trusts this workflow (trusted publishing); NPM_TOKEN only
# exists for the package's very first publish, before there is a package to set that up on.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@11
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Publish (a prerelease under the dist-tag next)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"
